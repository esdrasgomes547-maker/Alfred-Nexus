<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FactorIA</title>
    <style>
      /* ── Design System: Obsidian + Black Piano ── */
      :root {
        --bg-base:      #080808;
        --bg-surface:   #111111;
        --bg-card:      #181818;
        --bg-hover:     #1e1e1e;
        --bg-input:     #0d0d0d;
        --border:       #202020;
        --border-hi:    #2e2e2e;
        --accent:       #7c3aed;
        --accent-dim:   rgba(124, 58, 237, 0.10);
        --accent-glow:  rgba(124, 58, 237, 0.28);
        --accent-hover: #6d28d9;
        --text-pri:     #f0f0f0;
        --text-sec:     #777777;
        --text-muted:   #3a3a3a;
        --green:        #22c55e;
        --green-dim:    rgba(34, 197, 94, 0.12);
        --red:          #ef4444;
        --red-dim:      rgba(239, 68, 68, 0.12);
        --yellow:       #f59e0b;
        --yellow-dim:   rgba(245, 158, 11, 0.12);
        --blue:         #3b82f6;
        --radius-sm:    6px;
        --radius-md:    10px;
        --radius-lg:    16px;
        --font:         -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        --font-mono:    "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-base);
        color: var(--text-pri);
        font-family: var(--font);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      /* Scrollbar estilo obsidian */
      ::-webkit-scrollbar       { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

      /* Seleção */
      ::selection { background: var(--accent-dim); color: var(--text-pri); }

      /* Keyframes */
      @keyframes pulse-green {
        0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
        50%       { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      }
      @keyframes pulse-yellow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
        50%       { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes slide-in {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes glow-accent {
        0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
        50%       { box-shadow: 0 0 12px 2px var(--accent-glow); }
      }

      .fade-in  { animation: fade-in .22s ease both; }
      .slide-in { animation: slide-in .2s ease both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
