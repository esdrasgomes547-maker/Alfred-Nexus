services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Escuta apenas no loopback — acesso externo via Tailscale ou nginx reverso
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ALFRED_TOKEN=${ALFRED_TOKEN}
      - ALFRED_ENV=production
      - GROQ_MODEL=${GROQ_MODEL:-groq/llama-3.3-70b-versatile}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ollama/qwen2.5-coder:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SQLITE_PATH=/data/alfred.db
      - CHROMA_PATH=/data/chroma
      - ALFRED_WORKSPACE=/workspace
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-20}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # Hash de integridade do scope.yaml — gere com: sha256sum scope.yaml
      - SCOPE_HASH=${SCOPE_HASH:-}
    volumes:
      - alfred_data:/data
      - alfred_workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sem privilégios desnecessários
    user: "1000:1000"
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW   # necessário para ping no módulo de recon

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  alfred_data:
  alfred_workspace:

# Rede interna isolada — containers só se falam entre si
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: "172.28.0.0/16"
