services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ALFRED_TOKEN=${ALFRED_TOKEN}
      - GROQ_MODEL=${GROQ_MODEL:-groq/llama-3.3-70b-versatile}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ollama/qwen2.5-coder:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SQLITE_PATH=/data/alfred.db
      - CHROMA_PATH=/data/chroma
      - ALFRED_WORKSPACE=/workspace
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-30}
    volumes:
      - alfred_data:/data
      - alfred_workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  alfred_data:
  alfred_workspace:
